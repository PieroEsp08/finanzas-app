<div
  class="
    border
    border-gray-100
    rounded-2xl
    p-6
    transition-colors
    duration-300
    cursor-pointer
    bg-white
    hover:border-emerald-200
  "
>

  <div class="flex items-center gap-4 mb-5">

    <div
      class="
        w-12
        h-12
        rounded-2xl
        flex
        items-center
        justify-center
      "
      [ngClass]="{
        'bg-emerald-50 text-emerald-600': color === 'emerald',
        'bg-red-50 text-red-500': color === 'red',
        'bg-amber-50 text-amber-500': color === 'amber',
        'bg-blue-50 text-blue-500': color === 'blue'
      }"
    >

      <lucide-icon
        [img]="icono"
        class="w-5 h-5"
      >
      </lucide-icon>

    </div>

    <h3 class="text-xl font-bold text-gray-800">
      {{ titulo }}
    </h3>

  </div>

  <p class="text-gray-400 text-[15px] leading-7 mb-6">
    {{ descripcion }}
  </p>

  <span class="text-sm font-semibold text-emerald-600">
    Generar reporte →
  </span>

</div>
