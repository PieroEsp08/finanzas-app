<div class="bg-white border border-gray-100 rounded-2xl p-6">

  <div class="mb-5">
    <h3 class="text-base font-semibold text-gray-800">Metas de ahorro</h3>
    <p class="text-xs text-gray-400 mt-0.5">Progreso hacia tus objetivos</p>
  </div>

  <div class="space-y-5">
    @for (meta of metas; track meta.nombre) {
      <div>
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-base">{{ meta.icono }}</span>
            <span class="text-sm font-medium text-gray-700">{{ meta.nombre }}</span>
          </div>
          <span class="text-xs font-semibold text-gray-500">
            {{ getPorcentaje(meta) }}%
          </span>
        </div>

        <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
          <div
            class="h-full rounded-full transition-all duration-500"
            [style.width.%]="getPorcentaje(meta)"
            [style.background]="meta.color">
          </div>
        </div>

        <div class="flex justify-between mt-1.5">
          <span class="text-xs text-gray-400">
            S/ {{ meta.actual.toLocaleString('es-PE') }}
          </span>
          <span class="text-xs text-gray-400">
            S/ {{ meta.objetivo.toLocaleString('es-PE') }}
          </span>
        </div>
      </div>
    }
  </div>

</div>
