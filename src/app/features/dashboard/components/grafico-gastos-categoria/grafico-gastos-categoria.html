<div class="bg-white border border-gray-100 rounded-2xl p-6 h-full">

  <div class="mb-5">
    <h3 class="text-base font-semibold text-gray-800">Gastos por categoría</h3>
    <p class="text-xs text-gray-400 mt-0.5">Distribución del mes actual</p>
  </div>

  <div class="flex justify-center" style="height: 200px;">
    <canvas #donutChart></canvas>
  </div>

  <div class="mt-5 flex flex-col gap-2">
    @for (categoria of categorias; track categoria.label) {
      <div class="flex items-center gap-2">
        <span
          class="w-2.5 h-2.5 rounded-full flex-shrink-0"
          [style.background]="categoria.color">
        </span>
        <span class="text-xs text-gray-500 flex-1">{{ categoria.label }}</span>
        <span class="text-xs font-semibold text-gray-700">
          S/ {{ categoria.amount.toLocaleString('es-PE') }}
        </span>
        <span class="text-xs text-gray-400 w-10 text-right">
          {{ ((categoria.amount / total) * 100).toFixed(0) }}%
        </span>
      </div>
    }
  </div>

</div>
