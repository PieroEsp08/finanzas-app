<div class="space-y-6">

  <!-- Tabs de navegación -->
  <div class="flex items-center gap-2 w-full md:w-auto bg-gray-50/50 p-1 rounded-2xl md:bg-transparent md:p-0">
    @for (tab of tabs; track tab.valor) {
      <button
        type="button"
        class="flex-1 md:flex-none inline-flex items-center justify-center gap-2 px-3 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all whitespace-nowrap"
        [class.bg-emerald-500]="tabActivo === tab.valor"
        [class.text-white]="tabActivo === tab.valor"
        [class.shadow-sm]="tabActivo === tab.valor"
        [class.shadow-emerald-500\/20]="tabActivo === tab.valor"
        [class.text-gray-500]="tabActivo !== tab.valor"
        (click)="setTab(tab.valor)">
        <lucide-icon [img]="tab.icono" class="w-4 h-4 shrink-0" color="currentColor"></lucide-icon>
        <span>{{ tab.label }}</span>
      </button>
    }
  </div>

  <!-- Contenido del tab activo -->
  <div class="mt-6">
    @if (tabActivo === 'cuenta')      { <app-cuenta-tab />      }
    @if (tabActivo === 'general')     { <app-general-tab />     }
    @if (tabActivo === 'categorias')  { <app-categorias-tab />  }
  </div>

</div>
